","責任血管は左前下行枝(LAD)"],description:"左前下行枝(LAD)閉塞による広範な前壁梗塞。前胸部誘導V1–V4のST上昇が特徴で、左室の広い領域が障害されるため心不全・致死性不整脈・心原性ショックのリスクが高い「大きな梗塞」。",clinical:["最も予後に直結する梗塞のひとつ—迅速な再灌流療法へつなぐ","心室細動・心室頻拍の出現に厳重警戒し除細動器を即使用できる位置に","ポンプ失調(心不全・ショック)の徴候を継続監視","wide territoryのため血行動態が急変しうる"]},{id:"lateral_mi",name:"急性側壁心筋梗塞",nameEn:"Acute Lateral STEMI",cat:"ischemia",grade:"2級",hrText:"78 /分",axisText:"正常軸",rhythm:{type:"regular",rate:78},spec:{qrsAxis:40,tAxis:40,pAxis:60,st:{I:.24,aVL:.26,V5:.22,V6:.2,III:-.14,aVF:-.1},tOverride:{aVL:.4}},highlight:["I","aVL","V5","V6"],features:["I・aVL・V5・V6(側壁誘導)でST上昇","III・aVFに対側性ST低下","責任血管は左回旋枝(LCx)や対角枝"],description:"左室側壁の梗塞。側壁誘導I・aVL・V5・V6のST上昇が特徴。左回旋枝病変は標準12誘導で変化が乏しい(electrically silent)ことがあり、見逃されやすいので対側性変化も手がかりにする。",clinical:["高位側壁(I・aVL)のみのST上昇は見落としやすい—対側性ST低下に注目","12誘導で所見が乏しくても症状が強ければ後壁・側壁梗塞を疑い追加誘導を","再灌流療法の準備と致死性不整脈への警戒"]},{id:"pericarditis",name:"急性心膜炎",nameEn:"Acute Pericarditis",cat:"ischemia",grade:"2級",hrText:"92 /分",axisText:"正常軸",rhythm:{type:"regular",rate:92},spec:{qrsAxis:55,tAxis:45,pAxis:60,prDep:.06,st:{I:.14,II:.18,III:.1,aVF:.16,aVL:.06,V2:.16,V3:.2,V4:.2,V5:.18,V6:.14,aVR:-.16}},highlight:["II","V3","V4","V5","V6"],features:["びまん性(広範な)凹型ST上昇 — 単一の冠動脈支配域に一致しない","aVR は対側性に ST 低下(＋PR上昇)","多くの誘導で PR 部分の低下(PR depression)"],description:"心膜の炎症による疾患。STEMIと違い、特定の冠動脈支配域に限らず「広い範囲」で凹型(saddle様)のST上昇を示し、aVRのST低下とPR部分の低下を伴うのが鑑別点。胸痛は体位・呼吸で変化することが多い。心タンポナーデへの進展に注意。",clinical:["STEMI(限局性・凸型ST上昇＋対側性変化)との鑑別が最重要—12誘導全体を見る","胸痛の性状(前傾で軽減・吸気で増悪)や心膜摩擦音を確認","心タンポナーデ徴候(血圧低下・頸静脈怒張・心音減弱)に警戒","心エコー・炎症反応の評価につなげる"]},{id:"hyperk12",name:"高カリウム血症",nameEn:"Hyperkalemia",cat:"other",grade:"3–2級",hrText:"58 /分",axisText:"正常軸",rhythm:{type:"regular",rate:58},spec:{qrsAxis:55,tAxis:45,pAxis:60,widthScale:1.35,pMul:.25,tMul:2.3,tSigma:.03},highlight:["II","V2","V3","V4"],features:["左右対称で幅が狭く尖った、背の高いテント状T波(precordialで顕著)","P波の平低化・QRS幅の拡大","進行するとサインカーブ様となり心停止に至る"],description:"血清カリウム上昇による心電図変化。テント状T波が最初のサインで、進行とともにP波平低化→QRS開大→サインカーブと変化し突然心停止に至る。腎不全・透析患者、K製剤投与中、大量輸血、挫滅症候群などで要警
